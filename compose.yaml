services:
  bot:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_VISION_MODEL: ${ZAI_VISION_MODEL:-glm-4.6v}
      ZAI_MODEL: ${ZAI_MODEL:-glm-4.7}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      ALLOWED_CHAT_IDS: ${ALLOWED_CHAT_IDS:?Set ALLOWED_CHAT_IDS in .env}
      BOT_SUPERADMIN_IDS: ${BOT_SUPERADMIN_IDS:-}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-5242880}
      VOICE_MAX_SECONDS: ${VOICE_MAX_SECONDS:-120}
      HISTORY_MAX_MESSAGES: ${HISTORY_MAX_MESSAGES:-50}
      SUMMARY_MAX_CHARS: ${SUMMARY_MAX_CHARS:-4000}
      MEMORY_RETENTION_DAYS: ${MEMORY_RETENTION_DAYS:-30}
      USER_REQUESTS_PER_MINUTE: ${USER_REQUESTS_PER_MINUTE:-6}
      CHAT_REQUESTS_PER_MINUTE: ${CHAT_REQUESTS_PER_MINUTE:-30}
      USER_MEDIA_PER_MINUTE: ${USER_MEDIA_PER_MINUTE:-3}
      CHAT_BUDGET_USD: ${CHAT_BUDGET_USD:-0}
      WORKER_COUNT: ${WORKER_COUNT:-2}
      BOT_BUDGET_USD: ${BOT_BUDGET_USD:-10}
      API_MIN_INTERVAL_SECONDS: ${API_MIN_INTERVAL_SECONDS:-0.25}
      REPLY_COOLDOWN_SECONDS: ${REPLY_COOLDOWN_SECONDS:-10}
      PGHOST: db
      PGDATABASE: roleplay
      PGUSER: roleplay
      PGPASSWORD: ${BOT_DB_PASSWORD:?Set BOT_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, egress]
    restart: unless-stopped
    mem_limit: ${BOT_MEMORY_LIMIT:-512m}
    cpus: ${BOT_CPU_LIMIT:-1.0}
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: roleplay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BOT_DB_PASSWORD: ${BOT_DB_PASSWORD:?Set BOT_DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [backend]
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    cpus: ${DB_CPU_LIMIT:-1.0}
    pids_limit: 128
    shm_size: 128m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d roleplay"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"
volumes:
  database:
networks:
  backend:
    internal: true
  egress:
